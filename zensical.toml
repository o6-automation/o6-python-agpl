# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================

# !!! note	                    >>> blue/grey note
# !!! abstract / !!! summary	>>> purple
# !!! info	                    >>> blue
# !!! tip / !!! hint	        >>> green
# !!! success / !!! check	    >>> green
# !!! question / !!! help	    >>> teal
# !!! warning / !!! caution	    >>> amber
# !!! failure / !!! danger	    >>> red
# !!! bug	                    >>> red
# !!! example	                >>> purple
# !!! quote	                    >>> grey


[project]
site_name = "o6\\Python"
site_description = "Python bindings for open62541 with high-level OPC UA client and server utilities"
site_author = "o6-automation"

# Repository integration (for edit/view source actions)
repo_url = "https://github.com/o6-automation/o6-python-agpl"
repo_name = "o6-automation/o6-python-agpl"
