[build-system]
requires = ["setuptools>=65.4.1", "wheel", "numpy>=2.0,<3", "Cython>=3.0", "packaging"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "common: tests for types and structs (no server needed)",
    "client: client-only tests (may need external testserver)",
    "server: server-only tests (self-contained)",
    "e2e: end-to-end tests (Python server + Python client)",
    "external: requires the testserver on port 4840",
    "tooling: checks the repo toolchain, not o6 runtime behaviour",
]

[project]
name = "o6"
version = "2.0.2"
description = "High-performance OPC UA client and server for Python, built on open62541"
readme = { file = "README-pypi.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0,<3",
]
keywords = [
    "opcua",
    "opc-ua",
    "opc",
    "open62541",
    "iiot",
    "industrial-automation",
    "industry40",
    "plc",
    "scada",
    "fieldbus",
    "companion-specification",
    "nodeset",
    "uafx",
    "pubsub",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.o6-automation.com/o6-python/"
Homepage = "https://www.o6-automation.com/o6-python/"
Company = "https://www.o6-automation.com/"
"Source (AGPL)" = "https://github.com/o6-automation/o6-python-agpl"

[tool.black]
target-version = ["py311"]
line-length = 100
extend-exclude = '/(build|deps|docs|docs_gen|src|src_gen|tools|pyo6\.egg-info|_nodesets|o6/ns)/'

[tool.mypy]
# Consumer checks need the public types exported by these modules, but not
# diagnostics from generated namespaces or dynamic runtime materialization.
# Hand-written top-level modules are checked independently by test_mypy.py.

[[tool.mypy.overrides]]
module = ["o6.ns.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "o6",
    "o6._declarations",
    "o6._decorators",
    "o6._instances",
    "o6.client",
    "o6.server",
]
ignore_errors = true

[tool.coverage.run]
omit = [
    "o6/_nodesets/*",
    "tests/*",
]

# ---------------------------------------------------------------------------
# cibuildwheel configuration
# ---------------------------------------------------------------------------

[tool.cibuildwheel]
# Stable GIL-enabled CPython releases. 3.10 is not supported: o6 uses
# enum.FlagBoundary, which was added in 3.11.
build = "cp311-* cp312-* cp313-* cp314-*"
skip  = ["*-musllinux_*"]
environment = { PIP_ONLY_BINARY = "numpy", PIP_PREFER_BINARY = "1" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = """
yum install -y cmake openssl-devel git pkg-config
"""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Floor is macOS 15 (Sequoia), matching the prebuilt Homebrew openssl bottle
# on the GitHub-hosted runners -- no source rebuild or deployment-target
# override needed.
before-all = "brew install cmake openssl"
environment = {CMAKE_PREFIX_PATH = "$(brew --prefix)", MACOSX_DEPLOYMENT_TARGET = "15.0"}

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
# VCPKG_BUILD_TYPE is a triplet-file variable, not an environment variable --
# `set VCPKG_BUILD_TYPE=release` before invoking vcpkg has no effect on the
# stock x64-windows-static/arm64-windows-static triplets, which build both
# Debug and Release configurations. --overlay-triplets points at our own
# copies of those triplets (tools/vcpkg-triplets) with VCPKG_BUILD_TYPE set
# to release, since setup.py never links the debug OpenSSL libs.
# vcpkg is pinned to a specific release tag (kept in sync with the
# warm_windows_vcpkg_cache job in nightly-build.yml) rather than fetching
# heads/master: two independent CI jobs each bootstrapping "master" can land
# on different vcpkg commits, and vcpkg's binary-cache ABI hash folds in a
# fingerprint of vcpkg's own toolchain scripts -- a version mismatch between
# the two jobs silently invalidates the cache even when the requested
# port/triplet/version is identical.
before-all = "choco install cmake --installargs ADD_CMAKE_TO_PATH=System -y && powershell -NoProfile -ExecutionPolicy Bypass -Command \"if (-not (Test-Path 'C:\\vcpkg\\vcpkg.exe')) { Invoke-WebRequest -UseBasicParsing https://github.com/microsoft/vcpkg/archive/refs/tags/2026.07.29.tar.gz -OutFile C:\\vcpkg.tar.gz; New-Item -ItemType Directory -Force -Path C:\\vcpkg | Out-Null; tar xzf C:\\vcpkg.tar.gz -C C:\\vcpkg --strip-components=1; Remove-Item C:\\vcpkg.tar.gz; & C:\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics }\" && C:\\vcpkg\\vcpkg.exe install openssl:x64-windows-static openssl:arm64-windows-static --overlay-triplets={package}\\tools\\vcpkg-triplets"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path {package}\\deps\\open62541\\build-x64\\install\\bin --add-path {package}\\deps\\open62541\\build-arm64\\install\\bin -w {dest_dir} {wheel}"
